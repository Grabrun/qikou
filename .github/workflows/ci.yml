name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows 控制台默认 cp1252，中文输出会崩；统一按 UTF-8 写日志。
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 的 requires-python 保持一致。
        # 3.8 不支持：构建后端 setuptools>=77（PEP 639 许可元数据所需）
        # 要求 Python >= 3.9。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # ubuntu-latest 已是 26.04，setup-python 只提供 3.9 的 22.04/24.04
          # 预编译包；3.9 单独挂到 ubuntu-24.04 上跑。
          - os: ubuntu-latest
            python-version: "3.9"
          # Windows 只跑首尾两个版本：路径与大小写相关缺陷在两端就够暴露，
          # 全矩阵会把 job 数翻倍。
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Check the 205-case golden hash
        run: python tests/golden.py --check

  typing:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install mypy
      - name: Type check
        run: mypy

  package:
    name: build & twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Verify the wheel ships the corpus and the typing marker
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "qikou/py.typed" in names, names
          assert "qikou/kaomojis.txt" in names, names
          print("wheel ok:", whl)
          PY
